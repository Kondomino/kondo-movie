General:
  TIMEZONE: "UTC"

Authentication:
  ALLOWED_ORIGINS:
    [
      "http://localhost:3000",
      "http://localhost:3003",
      "https://kondomino.com.br",
      "https://www.kondomino.com.br",
      "https://api.kondomino.com.br",
      "https://media.kondomino.com.br",
    ]
  JWT_ALGORITHM: "HS256"
  SignedURL:
    GET_EXPIRY_IN_HOURS: 24
    PUT_EXPIRY_IN_MINUTES: 2
  # ADMINS list removed — admin status is owned by kondos-api
  # (users.is_admin column + JWT claim). kondo-movie no longer maintains
  # its own admin directory. See utils/admin_utils.py for the deprecation
  # stub that any remaining callers fall through.
  RESTRICTED_TEMPLATES: []

FeatureFlags:
  # Engine is stateless; no DB, no auth, no email/scraping/maps/url-shortening.
  # Only the AI vendors and the storage provider stay configurable.
  ENABLE_ELEVEN_LABS: true        # ElevenLabs TTS
  ENABLE_ASSEMBLY_AI: false       # AssemblyAI transcription
  ENABLE_OPENAI: true             # OpenAI narration script generation
  ENABLE_DIGITAL_OCEAN_STORAGE: true  # Digital Ocean Spaces (current default)
  ENABLE_CLOUDFLARE_R2_STORAGE: true  # Cloudflare R2 (target for Kondomino)
  ENABLE_GCP_STORAGE: false       # Google Cloud Storage (legacy)
  ENABLE_EMAIL_SERVICES: false    # Mailchimp/Mandrill email — dead path, kept as `false` so LazySecretManager falls through to env-var lookup


Secret:
  ELEVEN_LABS_API_KEY: "_ELEVEN_LABS_API_KEY"
  ASSEMBLY_AI_TRANSCRIBER_API_KEY: "_ASSEMBLY_AI_TRANSCRIBER_API_KEY"
  OPENAI_API_KEY: "_OPENAI_API_KEY"

Engines:
  TTS: "ElevenLabs" # Options - 'OpenAI', 'ElevenLabs'
  TRANSCRIBER: "AssemblyAI" # Options - 'OpenAI', 'AssemblyAI'

Storage:
  PROVIDER: "CloudflareR2"  # Options: "GCP", "DigitalOcean", "CloudflareR2"

DigitalOcean:
  Spaces:
    REGION: "nyc3"
    PROPERTIES_BUCKET: "kondo-properties"
    TEMPLATES_BUCKET: "kondo-templates"
    # Matches kondos-api DIGITAL_OCEAN_STORAGE_BUCKET so rendered videos
    # land in the same bucket the front-end already serves from.
    USER_BUCKET: "kondo-spaces-storage"
    CDN_ENABLED: true

Cloudflare:
  R2:
    PROPERTIES_BUCKET: "kondo-properties"
    TEMPLATES_BUCKET: "kondo-templates"
    # Matches kondos-api CLOUDFLARE_R2_STORAGE_BUCKET — single source of truth
    # for media (uploads + rendered outputs) once we cut over to R2 fully.
    USER_BUCKET: "kondo-media"
    # Endpoint, credentials and (optional) public URL prefix come from env:
    # CLOUDFLARE_R2_ENDPOINT, CLOUDFLARE_R2_KEY_ID, CLOUDFLARE_R2_ACCESS_KEY,
    # CLOUDFLARE_R2_PUBLIC_URL (optional, for CDN-style serving via custom domain
    # or pub-<id>.r2.dev). Names match kondos-api convention.

GCP:
  # Placeholder values for the legacy gs:// branch in `_fetch_images` and
  # the GCS adapter in `gcp/storage.py`. The v2 path doesn't reach this
  # code (Storage.PROVIDER=CloudflareR2, ENABLE_GCP_STORAGE=false); these
  # values exist only to keep imports and config validation happy. If the
  # GCS adapter is ever reactivated, set GCP.PROJECT_ID to a real project
  # and provision the buckets — names below match the kondos-api
  # conventions.
  PROJECT_ID: "kondomino"
  Storage:
    PROPERTIES_BUCKET: "kondo-properties"
    TEMPLATES_BUCKET: "kondo-templates"
    USER_BUCKET: "kondo-media"

OpenAI:
  Narration:
    RESPONSE_TOKEN_LIMIT: 180
    SCRIPT_MAX_WORDS: 30
    SCRIPT_CHAR_LIMIT: 190
    SCRIPT_MAX_CHARACTERS: 200
    MAX_GEN_ATTEMPTS: 5
    CHAT_MODEL: "gpt-4o"
    TTS:
      VOICE: "alloy" # OpenAI options: Alloy, Echo, Fable, Onyx, Nova, Shimmer
      MODEL: "tts-1"
  Classification:
    CHAT_MODEL: "gpt-4o-mini"

ElevenLabs:
  TTS:
    VOICE: "JBFqnCBsd6RMkjVDRZzb"
    MODEL: "eleven_multilingual_v2"
    VoiceSettings:
      STABILITY: 0.50
      SIMILARITY_BOOST: 0.75
      STYLE: 0.0
      USE_SPEAKER_BOOST: true

AssemblyAI:
  Transcription:

Property:
  IMAGES_DIR: "Images"
  IMAGE_LIMIT: 100
  RESCRAPE_AFTER: 72 # Number of hours after which a property is re-extracted

Music:
  STORAGE_DIR_PREFIX: "music"
  PLAY_IN_LOOP: false
  FADEOUT_DURATION: 0

Classification:
  REAL_ESTATE_DOC_ID: "real_estate_model"
  IMAGE_CLASSIFICATION_KEY: "image_classification"
  PRESELECTION_KEY: "preselection"
  MAX_LABELS: 100
  MIN_CLIPS_IN_LARGE_MOVIE: 10
  ENABLE_HERO_SHOT: true
  IMAGE_FORMAT: "JPEG"

MovieMaker:
  Video:
    RESOLUTION_LANDSCAPE: [1920, 1080]
    RESOLUTION_PORTRAIT: [1080, 1920]
    FRAME_RATE: 30
    CODEC: "libx264"
    AUDIO_CODEC: "aac"
    THREADS: 8
    WRITE_SPEED: "ultrafast" # (MoviePy:VideoClip) Choices are: ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow, placebo
  Image:
    ZOOM_FACTOR: 0.02
    INITIAL_ZOOM_IN_RATIO_FOR_ZOOM_OUT: 0.1
    PAN_SPEED: 1
    PADDING_COLOR: [0, 0, 0]
  Music:
    VOLUME_RATIO_WITH_VOICEOVER: 0.4
    VOLUME_RATIO_WITHOUT_VOICEOVER: 1
    OFFSET: 0 # Offset from start of video in seconds
  Narration:
    Captions:
      Font:
        NAME: "GothamOffice-Regular.otf"
        SIZE: 42
        COLOR: "white"
      Background:
        COLOR: "black"
      OPACITY: 0.60
      HEIGHT_FACTOR_LANDSCAPE: 0.75
      HEIGHT_FACTOR_PORTRAIT: 0.80
      ALIGNMENT: "center"
      FONT_MARGIN: [20, 25]
      TRANSCRIBER_MAX_WORDS_PER_LINE: 15 # Transcriber will ensure lines have no more than 15 words
      MAX_CHARS_PER_SRT_SEGMENT: 80 # If a line ends up with more characters, an 'intelligent' split is performed
      TEXTWRAP_MAX_CHARS_PER_LINE: 40 # Wrap text if line exceeds # of chars
      END_PERSIST_DURATION: 1.0 # Persist last caption for an additional amount of time
    Voiceover:
      MAPPINGS_STORAGE_DIR_PREFIX: "voiceover"
      VOLUME_RATIO: 1
      START_OFFSET: 3 # Offset from start of video in seconds
      END_OFFSET: 2.0 # Buffer b/w end of VO and end of video in seconds
      DURATION_VARIANCE: 1 # In seconds. # Say Movie is N seconds. Max VO duration = N-START_OFFSET-END_OFFSET. Min VO duration = Max VO duration - DURATION_VARIANCE
      MAX_ADJUSTMENT_FACTOR: [1.0, 1.25] # Limits to shink or expand VO to fit movie. Anything beyond this window may lead to pitch distortion, subpar audio
  EndTitles:
    General:
      PIXEL_GAP: 0
      BG_COLOR: [0, 0, 0]
      METHOD: "caption"
      ALIGNMENT: "center"
      LINE_SPLIT_ALGO: "AI" # Options are 'AI', 'MoviePy', 'Manual'
      MAX_LINES: 3
      TITLES_GAP: 10
    Geometry:
      Landscape:
        H_MARGIN: 190
        V_MARGIN: 100
      Portrait:
        H_MARGIN: 50
        V_MARGIN: 100
    Main:
      Font:
        NAME: "GothamOffice-Regular.otf"
        SIZE: 130
        COLOR: "white"
      LINE_SIZE: 142
      FONT_MARGIN: [0, 2]
    Sub:
      Font:
        NAME: "Gotham-Light.otf"
        SIZE: 64
        COLOR: "white"
      LINE_SIZE: 76
      FONT_MARGIN: [0, 2]
  Watermark:
    # Re-enabled 2026-05-04. Asset is `library/logo/kondomino_watermark.png`
    # (1280×180 wordmark, white with subtle drop shadow). Bundled in the
    # engine image via Dockerfile `COPY library/logo/`. `watermark.py`
    # resolves it via the same `library/<...>` pattern as EDL templates.
    # `MovieModel.config.watermark` now defaults to True — every render
    # carries the brand mark unless explicitly suppressed (future premium
    # feature).
    STORAGE_DIR_PREFIX: "logo"
    DEFAULT: "kondomino_watermark.png"
    PIXEL_OFFSET_WIDTH_LANDSCAPE: 48
    PIXEL_OFFSET_HEIGHT_LANDSCAPE: 36
    SIZE_BY_HEIGHT_LANDSCAPE: 32
    PIXEL_OFFSET_WIDTH_PORTRAIT: 36
    PIXEL_OFFSET_HEIGHT_PORTRAIT: 60
    SIZE_BY_HEIGHT_PORTRAIT: 36
    OPACITY: 0.85
  Text:
    LETTER_SPACING: 10

Notification:
  Email:
    SENDER: "contato@kondomino.com.br"
# Tenants block removed — multi-tenant Editora-era feature with zero callers
# in the kondomino engine. Re-add if multi-tenancy comes back as a real
# feature with a real consumer.