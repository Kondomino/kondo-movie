# fly.toml for kondo-movie — v1 launch deploy.
#
# Companion app to kondos-api. Both run on Fly.io in gru (São Paulo)
# for low-latency between the two and to media.kondomino.com.br (R2
# is global so region matters less for the storage roundtrip).
#
# Sizing notes:
#   - The render uses MoviePy + ffmpeg, which is CPU-bound.
#     shared-cpu-1x pegged at 100% for ~11min on a 60s mp4 in early
#     prod tests; performance-2x drops it to ~60-90s.
#   - 4GB memory leaves headroom for moviepy frame buffers on 1080p.
#   - auto_stop+auto_start: machine sleeps when idle (zero cost),
#     wakes on first request. Render-side cold start is ~5s.
#
# Health: GET / returns the welcome JSON without touching DB or
# external services, so the health probe is a pure readiness check.

app = 'kondo-movie'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENVIRONMENT = 'prod'
  DEPLOYMENT = 'flyio'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  # Renders take ~60s and block the worker. Cap concurrency so a
  # second render forces a fly machine spin-up rather than queueing
  # behind the first.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 2
    hard_limit = 4

[checks]
  # P3 of the reliability plan: probe /healthz, not /. Liveness only —
  # `/healthz` doesn't touch Redis/DB/external services so a slow
  # dependency can't flap the machine state. Readiness lives on
  # `/readyz` (operator-facing); Fly doesn't probe it because we
  # don't want a degraded worker to take the API machine down.
  # 15s interval gives faster recovery on legitimate liveness
  # failures without churning the proxy.
  [checks.health]
    port = 8080
    type = 'http'
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'
    path = '/healthz'

[[vm]]
  size = 'performance-2x'
  memory = '4gb'
