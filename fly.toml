# fly.toml for kondo-movie.
#
# P4 of the reliability plan: split into two processes within the same
# Fly app + same Docker image:
#
#   api    — uvicorn FastAPI, serves /make_movie, /healthz, /readyz.
#            auto_stop allowed; sleeps when idle, wakes on inbound HTTP.
#   worker — arq render worker, consumes the kondo:render queue.
#            A pinned worker (min_machines_running=1) is what the queue
#            would want — Fly's proxy can't see a Redis queue, so an
#            idle worker gets stopped with jobs still waiting. Same
#            perf-2x sizing because ffmpeg saturates 2 vCPUs.
#
# Both processes share the image — the Dockerfile builds once and
# the [processes] table below picks the entrypoint per group.
#
# COST DECISION (2026-09-01): both processes stay at count 0. A pinned
# perf-2x worker bills ~$62/mo whether or not a video is rendered, and
# the platform is dormant. After the first deploy:
#     fly scale count api=0 worker=0 -a kondomino-movie
# Wake it for a render session with `worker=1`, then scale back down.
# Full sequence and rationale: ops/migrate-org.md (steps 7, P4/P6).
#
# Rollback: set `fly secrets set KONDO_MOVIE_USE_QUEUE=false` to flip
# the api back to the in-process P2 path. The worker process can stay
# running idle without harm (no jobs land on the queue).

app = 'kondomino-movie'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENVIRONMENT = 'prod'
  DEPLOYMENT = 'flyio'
  PORT = '8080'

# ---- Process commands ----
# Both consume the same image; only the entrypoint differs.
[processes]
  api    = 'uvicorn src.main:app --host 0.0.0.0 --port 8080'
  worker = 'arq task_queue.worker.WorkerSettings'

# ---- HTTP service: api process only ----
# The worker exposes no HTTP surface; Fly's proxy doesn't route to it.
[[services]]
  protocol = 'tcp'
  internal_port = 8080
  processes = ['api']
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  # Renders take ~60s and saturate the worker per machine. Cap
  # concurrency so a burst on the api process forces queue depth
  # to grow instead of stacking concurrent requests on one worker
  # machine.
  [services.concurrency]
    type = 'requests'
    soft_limit = 2
    hard_limit = 4

  # P3 health probe: cheap liveness, no Redis. /readyz is operator-
  # facing; Fly doesn't probe it because we don't want a degraded
  # readiness signal to take the api machine down.
  [[services.http_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'
    method = 'get'
    path = '/healthz'

# ---- VM sizing ----
# api: perf-1x / 2GB. ffmpeg and moviepy run on the worker, so this
# process only serves /make_movie, /healthz and /readyz — it never
# touches a frame buffer. Halves the cost of the one engine machine
# that would ever be left awake. Raise back to perf-2x / 4gb if the
# import chain OOMs on boot. Mirrored in ops/fleet.conf (MOVIE_API_VM).
[[vm]]
  size = 'performance-1x'
  memory = '2gb'
  processes = ['api']

# worker: perf-2x is the floor for ffmpeg — do not downsize. 4GB
# matches moviepy frame buffers. Count is 0 while dormant (see the
# cost decision above); `fly scale count worker=1` wakes it.
[[vm]]
  size = 'performance-2x'
  memory = '4gb'
  processes = ['worker']
