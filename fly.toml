# fly.toml for kondo-movie.
#
# P4 of the reliability plan: split into two processes within the same
# Fly app + same Docker image:
#
#   api    — uvicorn FastAPI, serves /make_movie, /healthz, /readyz.
#            auto_stop allowed; sleeps when idle, wakes on inbound HTTP.
#   worker — arq render worker, consumes the kondo:render queue.
#            min_machines_running=1 so it survives idle (the queue is
#            an internal contract; Fly's proxy can't see it). Same
#            perf-2x sizing as before because ffmpeg saturates 2 vCPUs.
#
# Both processes share the image — the Dockerfile builds once and
# the [processes] table below picks the entrypoint per group.
#
# After deploying for the first time, scale the worker explicitly:
#     fly scale count worker=1 --region gru
# (api defaults to 1 machine via min_machines_running=0 + auto_start.)
#
# Rollback: set `fly secrets set KONDO_MOVIE_USE_QUEUE=false` to flip
# the api back to the in-process P2 path. The worker process can stay
# running idle without harm (no jobs land on the queue).

app = 'kondo-movie'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENVIRONMENT = 'prod'
  DEPLOYMENT = 'flyio'
  PORT = '8080'

# ---- Process commands ----
# Both consume the same image; only the entrypoint differs.
[processes]
  api    = 'uvicorn src.main:app --host 0.0.0.0 --port 8080'
  worker = 'arq task_queue.worker.WorkerSettings'

# ---- HTTP service: api process only ----
# The worker exposes no HTTP surface; Fly's proxy doesn't route to it.
[[services]]
  protocol = 'tcp'
  internal_port = 8080
  processes = ['api']
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  # Renders take ~60s and saturate the worker per machine. Cap
  # concurrency so a burst on the api process forces queue depth
  # to grow instead of stacking concurrent requests on one worker
  # machine.
  [services.concurrency]
    type = 'requests'
    soft_limit = 2
    hard_limit = 4

  # P3 health probe: cheap liveness, no Redis. /readyz is operator-
  # facing; Fly doesn't probe it because we don't want a degraded
  # readiness signal to take the api machine down.
  [[services.http_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'
    method = 'get'
    path = '/healthz'

# ---- VM sizing ----
# api: same perf-2x as before. Could downsize to perf-1x once we
# confirm the imports don't push memory; deferred.
[[vm]]
  size = 'performance-2x'
  memory = '4gb'
  processes = ['api']

# worker: perf-2x is the floor for ffmpeg. 4GB matches moviepy frame
# buffers. min_machines_running=1 enforced via `fly scale count`.
[[vm]]
  size = 'performance-2x'
  memory = '4gb'
  processes = ['worker']
